{% extends "base.html" %}
{% block title %}Verificação em duas etapas{% endblock %}
{% block content %}
<section class="cartao estreito">
  <h1>Verificação em duas etapas</h1>
  <p>Digite o código de 6 dígitos do seu aplicativo autenticador (ou um código de recuperação).</p>
  <form method="post" autocomplete="one-time-code">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Código <input name="codigo" required inputmode="numeric" autocomplete="one-time-code" autofocus></label>
    <button class="btn" type="submit">Confirmar</button>
  </form>
</section>
{% endblock %}
